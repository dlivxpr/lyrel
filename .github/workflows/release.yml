name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag to assemble; empty only builds and warms caches'
        required: false
        type: string
      reuse_run_id:
        description: 'Completed Release run whose production artifacts should be reused'
        required: false
        type: string
      draft_release_id:
        description: 'Existing stable draft release ID to assemble without publishing'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
      artifact_run_id: ${{ steps.source.outputs.artifact_run_id }}
    steps:
      - name: Resolve immutable source and validate reusable production run
        id: source
        uses: actions/github-script@v8
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        with:
          script: |
            const fail = message => { throw new Error(message); };
            const repo = context.repo;
            const tag = context.eventName === 'push'
              ? context.ref.replace(/^refs\/tags\//, '') : process.env.INPUT_TAG;
            const reuse = process.env.REUSE_RUN_ID;
            const draft = process.env.DRAFT_RELEASE_ID;
            const positiveId = value => /^[1-9][0-9]*$/.test(value) && Number.isSafeInteger(Number(value));
            if (reuse && (!process.env.INPUT_TAG || !positiveId(reuse))) {
              fail('reuse_run_id requires an explicit tag and a positive integer run ID');
            }
            if (draft && (!tag || !positiveId(draft))) {
              fail('draft_release_id requires a tag and a positive integer release ID');
            }
            let sourceSha = context.sha;
            if (tag) {
              if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
                fail('tag must be an exact stable v<version> tag');
              }
              let object = (await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` })).data.object;
              for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
                object = (await github.rest.git.getTag({ ...repo, tag_sha: object.sha })).data.object;
              }
              if (object.type !== 'commit') fail('tag must resolve to a commit');
              sourceSha = object.sha;
              if (context.eventName === 'push' && sourceSha !== context.sha) {
                fail('tag commit no longer matches the triggering source SHA');
              }
            }
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) fail('source SHA must be an immutable commit');
            if (reuse) {
              const runId = Number(reuse);
              const run = (await github.rest.actions.getWorkflowRun({ ...repo, run_id: runId })).data;
              const workflow = (await github.rest.actions.getWorkflow({ ...repo, workflow_id: 'release.yml' })).data;
              const repository = `${repo.owner}/${repo.repo}`;
              if (run.repository.full_name !== repository || run.head_repository?.full_name !== repository ||
                  run.head_repository?.fork !== false || run.workflow_id !== workflow.id ||
                  run.path !== '.github/workflows/release.yml' || workflow.path !== '.github/workflows/release.yml' ||
                  run.head_sha !== sourceSha || run.status !== 'completed' ||
                  !['push', 'workflow_dispatch'].includes(run.event) ||
                  (run.pull_requests || []).some(pr => pr.head.repo.id !== run.repository.id)) {
                fail('reuse run must be a completed same-repository Release workflow run at the exact tag commit, not a fork PR');
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: runId, filter: 'latest', per_page: 100
              });
              const production = jobs.filter(job => job.name !== 'draft-release');
              if (production.some(job => job.status !== 'completed' || job.conclusion !== 'success' || job.head_sha !== sourceSha)) {
                fail('every production job in the reused run must have succeeded at the tag commit');
              }
              for (const [name, count] of [['version', 1], ['build', 2], ['server-musl', 2], ['server-macos', 1], ['server-windows', 1]]) {
                if (production.filter(job => job.name === name || job.name.startsWith(`${name} (`)).length !== count) {
                  fail(`reuse run is missing the complete successful ${name} production matrix`);
                }
              }
              const packs = production.filter(job => job.name === 'pack' || job.name.startsWith('pack ('));
              if (packs.length !== 0 && packs.length !== 2) fail('reuse run has an incomplete desktop packaging matrix');
              const expected = [
                'release-macos-arm64', 'release-windows-x86_64',
                'release-lyrel-server-linux-aarch64-musl', 'release-lyrel-server-linux-x86_64-musl',
                'release-lyrel-server-macos-aarch64', 'release-lyrel-server-windows-x86_64.zip'
              ];
              const artifacts = (await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...repo, run_id: runId, per_page: 100
              })).filter(artifact => artifact.name.startsWith('release-'));
              if (artifacts.length !== expected.length || expected.some(name =>
                  artifacts.filter(artifact => artifact.name === name && artifact.expired === false &&
                    artifact.size_in_bytes > 0 && Date.parse(artifact.expires_at) > Date.now() &&
                    artifact.workflow_run?.id === runId && artifact.workflow_run?.head_sha === sourceSha &&
                    artifact.workflow_run?.repository_id === run.repository.id &&
                    artifact.workflow_run?.head_repository_id === run.repository.id).length !== 1)) {
                fail('reuse requires exactly the six unexpired release artifacts from the verified source run');
              }
            }
            core.setOutput('source_sha', sourceSha);
            core.setOutput('tag', tag);
            core.setOutput('artifact_run_id', reuse || String(context.runId));

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - name: Check stable workspace version and tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::workspace.package.version must be stable"; exit 1;
          }
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "::error::release tag must match workspace.package.version: v$VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 桌面编译与全部 server 并行；仅打包阶段等待 WSL musl server。
  build:
    needs: version
    if: needs.version.result == 'success' && inputs.reuse_run_id == ''
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          path: lyrel
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          shared-key: release-v2-${{ matrix.target }}-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Prepare ConPTY
        if: matrix.os == 'windows'
        working-directory: lyrel
        shell: pwsh
        run: '& ./scripts/prepare-conpty.ps1'

      # 一次 feature 统一编译全部默认 bins，不重复构建无 updater 的桌面图。
      - name: Build all default binaries with updater
        working-directory: lyrel
        shell: bash
        run: cargo build --release --locked --features updater --target "${{ matrix.target }}"

      # tar 保留 macOS 可执行权限；只带打包输入，不传 target 缓存或整个源码树。
      - name: Archive desktop packaging inputs
        working-directory: lyrel
        shell: bash
        env:
          DESKTOP_OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          SUFFIX=""
          EXTRA=(assets/lyrel.icns)
          if [[ "$DESKTOP_OS" == windows ]]; then
            SUFFIX=.exe
            EXTRA=(assets/windows/conpty/manifest.json .conpty/x64/conpty.dll .conpty/x64/OpenConsole.exe .conpty/LICENSE-ConPTY.txt)
          fi
          tar -czf "$RUNNER_TEMP/desktop-$TARGET.tar.gz" \
            "target/$TARGET/release/lyrel-app$SUFFIX" \
            "target/$TARGET/release/lyrel$SUFFIX" \
            "target/$TARGET/release/lyrel-updater$SUFFIX" \
            Cargo.toml LICENSE README.md assets/completions "${EXTRA[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-inputs-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-${{ matrix.target }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  pack:
    needs: [version, build, server-musl]
    if: >-
      always() && needs.version.result == 'success' && inputs.reuse_run_id == '' &&
      needs.build.result == 'success' && needs.server-musl.result == 'success'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            wsl-server: lyrel-server-linux-x86_64-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged packaging scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          path: lyrel
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: desktop-inputs-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-inputs

      - name: Restore desktop packaging inputs and executable permissions
        working-directory: lyrel
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/desktop-inputs/desktop-${{ matrix.target }}.tar.gz"

      # 无 Apple secrets 时仍由原脚本做 ad-hoc 签名与 Mach-O 校验。
      - name: Bundle macOS DMG
        if: matrix.os == 'macos'
        working-directory: lyrel
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/bundle-macos.sh "${{ matrix.target }}" "${{ matrix.arch }}"

      - name: Fetch the bundled Linux server
        if: matrix.os == 'windows'
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.wsl-server }}
          path: lyrel/bundled-server

      - name: Package Windows installer + zip
        if: matrix.os == 'windows'
        working-directory: lyrel
        shell: pwsh
        run: '& ./.github/scripts/bundle-windows.ps1 "${{ matrix.target }}" "${{ matrix.arch }}"'

      - name: Verify Windows update package
        if: matrix.os == 'windows'
        working-directory: lyrel
        shell: pwsh
        run: '& ./.github/scripts/verify-windows-package.ps1 "${{ matrix.arch }}"'

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            lyrel/dist/*.dmg
            lyrel/dist/*.zip
            lyrel/dist/*-setup.exe
          compression-level: 0
          if-no-files-found: error

  # The headless server binary remote workspaces install on the far machine
  # (decision D10). Statically linked against musl so a single binary runs
  # on any distro whatever its glibc vintage, and shipped as a bare executable
  # rather than an archive so the client can fetch exactly one file and verify it
  # against checksums.txt. The asset names are a contract with the installer:
  # `lyrel_core::daemon::install::asset` derives them from `uname -sm`.
  #
  # Separate from the `build` matrix above because it shares nothing with it: no
  # GUI toolchain, no bundling, no code signing, two targets off one runner.
  server-musl:
    needs: version
    if: needs.version.result == 'success' && inputs.reuse_run_id == ''
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # `target` is the build triple; `asset` is the published filename. They
      # are deliberately not the same string — the triple's vendor field is
      # `unknown`, which says nothing to anyone reading the releases page. See
      # `install::asset::ASSET_X86_64`, which pins these two names as literals.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: lyrel-server-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            asset: lyrel-server-linux-aarch64-musl
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -C strip=symbols
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          path: lyrel
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zig provides the musl sysroot and the C cross-compiler for both targets
      # from one x86_64 runner — see the same job in ci.yml for why the
      # alternatives (cross, musl-tools) do not cope with aws-lc-rs' cmake build.
      - name: Install Zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: ziglang==0.16.0
          "$RUNNER_TEMP/zig/bin/python" -m ziglang version
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$RUNNER_TEMP/zig/bin/python" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          shared-key: release-v2-${{ matrix.target }}-server-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # lyrel-server 已是 workspace 成员，完整 stable 发行不再允许跳过 server。

      # `--locked` for the same reason the GUI build uses it: a release ships the
      # dependency set the tag recorded. `-p lyrel-server` both addresses the
      # package independently of its path and keeps feature unification off the
      # GUI's `gssapi` feature, which cannot build under musl.
      - name: Build static lyrel-server
        working-directory: lyrel
        run: cargo zigbuild --release --locked -p lyrel-server --target ${{ matrix.target }}

      - name: Assert the binary is static
        working-directory: lyrel
        run: bash .github/scripts/assert-static.sh "target/${{ matrix.target }}/release/lyrel-server"

      # Flat, version-free asset name — the tag in the download URL carries the
      # version. See `install::asset` for the contract the client
      # installer derives this name from.
      - name: Stage the asset
        working-directory: lyrel
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lyrel-server" \
             "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: lyrel/dist/${{ matrix.asset }}
          if-no-files-found: error

  # The same server for remote Macs, published under the same contract: flat,
  # version-free names that `install::asset` derives from `uname -sm`. Separate
  # from `server-musl` because an Apple target needs an Apple runner, and the
  # arm64 slice comes off one arm64 runner. See ci.yml's `server-macos` for the
  # rest of the reasoning; keep the workflow matrices and `install::asset` in
  # sync.
  #
  # macOS server 只做 ad-hoc 签名和 Mach-O 自包含检查，不提供公证声明。
  server-macos:
    needs: version
    if: needs.version.result == 'success' && inputs.reuse_run_id == ''
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            asset: lyrel-server-macos-aarch64
    runs-on: macos-15
    env:
      RUSTFLAGS: -C strip=symbols
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          path: lyrel
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          shared-key: release-v2-${{ matrix.target }}-server-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true


      - name: Build lyrel-server
        working-directory: lyrel
        run: cargo build --release --locked -p lyrel-server --target ${{ matrix.target }}

      # 明确保留 ad-hoc 签名；不依赖 Apple secrets。
      - name: Ad-hoc sign the binary
        working-directory: lyrel
        run: codesign --force --sign - "target/${{ matrix.target }}/release/lyrel-server"

      - name: Assert the binary is self-contained
        working-directory: lyrel
        run: |
          bash .github/scripts/assert-macho.sh \
            "target/${{ matrix.target }}/release/lyrel-server" "${{ matrix.arch }}"

      - name: Stage the asset
        working-directory: lyrel
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lyrel-server" \
             "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: lyrel/dist/${{ matrix.asset }}
          if-no-files-found: error

  # The server for remote Windows hosts (Windows OpenSSH), under the same
  # contract: flat, version-free names that `install::asset` derives from the
  # host's `PROCESSOR_ARCHITECTURE`, looked up in checksums.txt by exactly
  # that name. The asset is a ZIP because the server cannot start a pane
  # without the pinned ConPTY set beside it (`daemon::conpty` fails closed):
  # `lyrel-server.exe` plus the `conpty.dll` / `OpenConsole.exe` /
  # `LICENSE-ConPTY.txt` trio from the pinned official package, and the
  # project's LICENSE.txt.
  #
  # No RUSTFLAGS here, unlike the other server jobs: setting it would replace
  # `.cargo/config.toml`'s `+crt-static` wholesale, and a server that imports
  # VCRUNTIME140.dll will not start on a Windows host without the Visual C++
  # redistributable — which a headless server is the likeliest machine to lack.
  # Symbols are stripped through the profile instead.
  #
  server-windows:
    needs: version
    if: needs.version.result == 'success' && inputs.reuse_run_id == ''
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset: lyrel-server-windows-x86_64.zip
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          path: lyrel
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          shared-key: release-v2-${{ matrix.target }}-server-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The server's build.rs fails closed without the prepared ConPTY pair,
      # and the packaging step below zips exactly the files it staged beside
      # the built executable — the same prepare entry a developer runs, so
      # this asset and every dev/test executable carry the identical pinned
      # set.
      - name: Prepare ConPTY
        working-directory: lyrel
        shell: pwsh
        run: '& ./scripts/prepare-conpty.ps1'

      - name: Build lyrel-server
        working-directory: lyrel
        run: cargo build --release --locked -p lyrel-server --target ${{ matrix.target }}

      - name: Assert the binary needs no VC++ redistributable
        working-directory: lyrel
        shell: pwsh
        run: '& ./.github/scripts/assert-no-vcruntime.ps1 "target/${{ matrix.target }}/release/lyrel-server.exe"'

      # Zip the server with the ConPTY set build.rs staged beside it. The
      # trio is re-hashed against the pinned manifest here so a staging
      # mistake fails the release instead of shipping an uninstallable asset
      # — the installer unpacks exactly this flat layout
      # (`daemon::install::package`).
      - name: Stage the asset
        working-directory: lyrel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Release = "target/${{ matrix.target }}/release"
          $ConptyArch = @{ 'x86_64-pc-windows-msvc' = 'x64' }['${{ matrix.target }}']
          if (-not $ConptyArch) { throw "no prepared ConPTY for ${{ matrix.target }}" }
          $Manifest = Get-Content -LiteralPath 'assets/windows/conpty/manifest.json' -Raw | ConvertFrom-Json
          foreach ($File in 'conpty.dll', 'OpenConsole.exe') {
            $Path = "$Release/$File"
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "build did not stage $Path" }
            if ((Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash -ne $Manifest.files.$ConptyArch.$File) {
              throw "$Path SHA-256 mismatch against the pinned ConPTY manifest"
            }
          }
          if ((Get-FileHash -LiteralPath "$Release/LICENSE-ConPTY.txt" -Algorithm SHA256).Hash -ne $Manifest.licenseSha256) {
            throw "$Release/LICENSE-ConPTY.txt SHA-256 mismatch against the pinned ConPTY manifest"
          }
          New-Item -ItemType Directory -Force dist/server-stage | Out-Null
          Copy-Item "$Release/lyrel-server.exe" 'dist/server-stage/lyrel-server.exe'
          Copy-Item "$Release/conpty.dll" 'dist/server-stage/conpty.dll'
          Copy-Item "$Release/OpenConsole.exe" 'dist/server-stage/OpenConsole.exe'
          Copy-Item "$Release/LICENSE-ConPTY.txt" 'dist/server-stage/LICENSE-ConPTY.txt'
          Copy-Item 'LICENSE' 'dist/server-stage/LICENSE.txt'
          Compress-Archive -Path 'dist/server-stage/*' -DestinationPath "dist/${{ matrix.asset }}" -Force
          Remove-Item -Recurse -Force dist/server-stage

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: lyrel/dist/${{ matrix.asset }}
          compression-level: 0
          if-no-files-found: error

  # main 无显式 tag 的手动运行仅预热；有效复用可越过全部 skipped 生产 jobs。
  # 仅汇总 stable draft，不 publish；最终发布仍需 CI、资产与中文说明审核。
  draft-release:
    needs: [version, build, pack, server-musl, server-macos, server-windows]
    if: >-
      always() && needs.version.result == 'success' && needs.version.outputs.tag != '' &&
      ((inputs.reuse_run_id != '' && needs.version.outputs.artifact_run_id == inputs.reuse_run_id) ||
       (inputs.reuse_run_id == '' && needs.build.result == 'success' && needs.pack.result == 'success' &&
        needs.server-musl.result == 'success' && needs.server-macos.result == 'success' &&
        needs.server-windows.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
    steps:
      # 旧 tag 可能没有新汇总脚本；脚本必须来自本次受信 workflow 的固定提交。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: lyrel
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ needs.version.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Assemble stable draft without publishing or replacing assets
        working-directory: lyrel
        shell: bash
        run: bash .github/scripts/assemble-release.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist"
