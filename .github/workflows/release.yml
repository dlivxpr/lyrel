name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check stable workspace version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::workspace.package.version must be stable"; exit 1;
          }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::release tag must match workspace.package.version: v$VERSION"; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "::error::only an exact stable version tag can assemble a release"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    # Windows 包必须嵌入真实 Linux musl WSL server；缺失时停止打包。
    needs: [version, server-musl]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            wsl-server: lyrel-server-linux-x86_64-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          path: lyrel
          persist-credentials: false


      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          # 每个目标独立缓存，避免平台产物相互覆盖。
          key: ${{ matrix.target }}

      # Windows build.rs fails without the prepared ConPTY pair: fetch and
      # verify the pinned nupkg before compiling. Not a release download — this
      # is the same prepare entry a developer runs.
      - name: Prepare ConPTY
        if: matrix.os == 'windows'
        working-directory: lyrel
        shell: pwsh
        run: '& ./scripts/prepare-conpty.ps1'

      # `--locked` because a release must ship the dependency set the tag
      # recorded, not whatever cargo would re-resolve at build time. Nothing
      # rewrites Cargo.toml: this is a plain checkout of the tagged commit.
      # 桌面 updater 仅随 macOS bundle 和 Windows 包分发。

      - name: Build
        working-directory: lyrel
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          cargo build --release --locked --features updater \
            --bin lyrel-updater --target "${{ matrix.target }}"

      # ---- Packaging: one step per OS ----------------------------------------
      # 无 Apple secrets 时使用 ad-hoc 签名，不声称 Developer ID 或公证。
      - name: Bundle macOS DMG
        if: matrix.os == 'macos'
        working-directory: lyrel
        env:
          # macOS code signing — the cert is imported into a throwaway keychain.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Notarization — required for Developer ID builds to pass Gatekeeper.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/bundle-macos.sh "${{ matrix.target }}" "${{ matrix.arch }}"

      # 完整 stable Windows 包必须带同架构 WSL server；缺失时停止打包。
      - name: Fetch the bundled Linux server
        if: matrix.os == 'windows'
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.wsl-server }}
          path: lyrel/bundled-server

      - name: Package Windows installer + zip
        if: matrix.os == 'windows'
        working-directory: lyrel
        shell: pwsh
        run: '& ./.github/scripts/bundle-windows.ps1 "${{ matrix.target }}" "${{ matrix.arch }}"'

      # The in-app updater refuses a package whose marker, helper or stamped
      # version is wrong — on the user's machine, after the download. Check the
      # same facts here so a packaging mistake fails the release instead.
      - name: Verify Windows update package
        if: matrix.os == 'windows'
        working-directory: lyrel
        shell: pwsh
        run: '& ./.github/scripts/verify-windows-package.ps1 "${{ matrix.arch }}"'

      # 只上传正式包；应用目录、entitlements 和 Windows 暂存目录不得进入 Release。
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            lyrel/dist/*.dmg
            lyrel/dist/*.zip
            lyrel/dist/*-setup.exe
          if-no-files-found: error

  # The headless server binary remote workspaces install on the far machine
  # (decision D10). Statically linked against musl so a single binary runs
  # on any distro whatever its glibc vintage, and shipped as a bare executable
  # rather than an archive so the client can fetch exactly one file and verify it
  # against checksums.txt. The asset names are a contract with the installer:
  # `lyrel_core::daemon::install::asset` derives them from `uname -sm`.
  #
  # Separate from the `build` matrix above because it shares nothing with it: no
  # GUI toolchain, no bundling, no code signing, two targets off one runner.
  server-musl:
    needs: version
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # `target` is the build triple; `asset` is the published filename. They
      # are deliberately not the same string — the triple's vendor field is
      # `unknown`, which says nothing to anyone reading the releases page. See
      # `install::asset::ASSET_X86_64`, which pins these two names as literals.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: lyrel-server-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            asset: lyrel-server-linux-aarch64-musl
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -C strip=symbols
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          path: lyrel
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zig provides the musl sysroot and the C cross-compiler for both targets
      # from one x86_64 runner — see the same job in ci.yml for why the
      # alternatives (cross, musl-tools) do not cope with aws-lc-rs' cmake build.
      - name: Install Zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: ziglang==0.16.0
          "$RUNNER_TEMP/zig/bin/python" -m ziglang version
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$RUNNER_TEMP/zig/bin/python" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          key: ${{ matrix.target }}

      # lyrel-server 已是 workspace 成员，完整 stable 发行不再允许跳过 server。

      # `--locked` for the same reason the GUI build uses it: a release ships the
      # dependency set the tag recorded. `-p lyrel-server` both addresses the
      # package independently of its path and keeps feature unification off the
      # GUI's `gssapi` feature, which cannot build under musl.
      - name: Build static lyrel-server
        working-directory: lyrel
        run: cargo zigbuild --release --locked -p lyrel-server --target ${{ matrix.target }}

      - name: Assert the binary is static
        working-directory: lyrel
        run: bash .github/scripts/assert-static.sh "target/${{ matrix.target }}/release/lyrel-server"

      # Flat, version-free asset name — the tag in the download URL carries the
      # version. See `install::asset` for the contract the client
      # installer derives this name from.
      - name: Stage the asset
        working-directory: lyrel
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lyrel-server" \
             "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: lyrel/dist/${{ matrix.asset }}
          if-no-files-found: error

  # The same server for remote Macs, published under the same contract: flat,
  # version-free names that `install::asset` derives from `uname -sm`. Separate
  # from `server-musl` because an Apple target needs an Apple runner, and the
  # arm64 slice comes off one arm64 runner. See ci.yml's `server-macos` for the
  # rest of the reasoning; keep the workflow matrices and `install::asset` in
  # sync.
  #
  # macOS server 只做 ad-hoc 签名和 Mach-O 自包含检查，不提供公证声明。
  server-macos:
    needs: version
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            asset: lyrel-server-macos-aarch64
    runs-on: macos-15
    env:
      RUSTFLAGS: -C strip=symbols
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          path: lyrel
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          key: ${{ matrix.target }}


      - name: Build lyrel-server
        working-directory: lyrel
        run: cargo build --release --locked -p lyrel-server --target ${{ matrix.target }}

      # 明确保留 ad-hoc 签名；不依赖 Apple secrets。
      - name: Ad-hoc sign the binary
        working-directory: lyrel
        run: codesign --force --sign - "target/${{ matrix.target }}/release/lyrel-server"

      - name: Assert the binary is self-contained
        working-directory: lyrel
        run: |
          bash .github/scripts/assert-macho.sh \
            "target/${{ matrix.target }}/release/lyrel-server" "${{ matrix.arch }}"

      - name: Stage the asset
        working-directory: lyrel
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lyrel-server" \
             "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: lyrel/dist/${{ matrix.asset }}
          if-no-files-found: error

  # The server for remote Windows hosts (Windows OpenSSH), under the same
  # contract: flat, version-free names that `install::asset` derives from the
  # host's `PROCESSOR_ARCHITECTURE`, looked up in checksums.txt by exactly
  # that name. The asset is a ZIP because the server cannot start a pane
  # without the pinned ConPTY set beside it (`daemon::conpty` fails closed):
  # `lyrel-server.exe` plus the `conpty.dll` / `OpenConsole.exe` /
  # `LICENSE-ConPTY.txt` trio from the pinned official package, and the
  # project's LICENSE.txt.
  #
  # No RUSTFLAGS here, unlike the other server jobs: setting it would replace
  # `.cargo/config.toml`'s `+crt-static` wholesale, and a server that imports
  # VCRUNTIME140.dll will not start on a Windows host without the Visual C++
  # redistributable — which a headless server is the likeliest machine to lack.
  # Symbols are stripped through the profile instead.
  #
  server-windows:
    needs: version
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset: lyrel-server-windows-x86_64.zip
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: Checkout lyrel
        uses: actions/checkout@v7
        with:
          path: lyrel
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lyrel
          key: ${{ matrix.target }}

      # The server's build.rs fails closed without the prepared ConPTY pair,
      # and the packaging step below zips exactly the files it staged beside
      # the built executable — the same prepare entry a developer runs, so
      # this asset and every dev/test executable carry the identical pinned
      # set.
      - name: Prepare ConPTY
        working-directory: lyrel
        shell: pwsh
        run: '& ./scripts/prepare-conpty.ps1'

      - name: Build lyrel-server
        working-directory: lyrel
        run: cargo build --release --locked -p lyrel-server --target ${{ matrix.target }}

      - name: Assert the binary needs no VC++ redistributable
        working-directory: lyrel
        shell: pwsh
        run: '& ./.github/scripts/assert-no-vcruntime.ps1 "target/${{ matrix.target }}/release/lyrel-server.exe"'

      # Zip the server with the ConPTY set build.rs staged beside it. The
      # trio is re-hashed against the pinned manifest here so a staging
      # mistake fails the release instead of shipping an uninstallable asset
      # — the installer unpacks exactly this flat layout
      # (`daemon::install::package`).
      - name: Stage the asset
        working-directory: lyrel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Release = "target/${{ matrix.target }}/release"
          $ConptyArch = @{ 'x86_64-pc-windows-msvc' = 'x64' }['${{ matrix.target }}']
          if (-not $ConptyArch) { throw "no prepared ConPTY for ${{ matrix.target }}" }
          $Manifest = Get-Content -LiteralPath 'assets/windows/conpty/manifest.json' -Raw | ConvertFrom-Json
          foreach ($File in 'conpty.dll', 'OpenConsole.exe') {
            $Path = "$Release/$File"
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "build did not stage $Path" }
            if ((Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash -ne $Manifest.files.$ConptyArch.$File) {
              throw "$Path SHA-256 mismatch against the pinned ConPTY manifest"
            }
          }
          if ((Get-FileHash -LiteralPath "$Release/LICENSE-ConPTY.txt" -Algorithm SHA256).Hash -ne $Manifest.licenseSha256) {
            throw "$Release/LICENSE-ConPTY.txt SHA-256 mismatch against the pinned ConPTY manifest"
          }
          New-Item -ItemType Directory -Force dist/server-stage | Out-Null
          Copy-Item "$Release/lyrel-server.exe" 'dist/server-stage/lyrel-server.exe'
          Copy-Item "$Release/conpty.dll" 'dist/server-stage/conpty.dll'
          Copy-Item "$Release/OpenConsole.exe" 'dist/server-stage/OpenConsole.exe'
          Copy-Item "$Release/LICENSE-ConPTY.txt" 'dist/server-stage/LICENSE-ConPTY.txt'
          Copy-Item 'LICENSE' 'dist/server-stage/LICENSE.txt'
          Compress-Archive -Path 'dist/server-stage/*' -DestinationPath "dist/${{ matrix.asset }}" -Force
          Remove-Item -Recurse -Force dist/server-stage

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: lyrel/dist/${{ matrix.asset }}
          if-no-files-found: error

  # 仅 tag push 汇总 draft；手动 dispatch 只构建与保存 artifacts。
  # 发布前必须等待 CI、复核全部资产和中文说明，再由发行负责人 publish。
  draft-release:
    needs: [version, build, server-musl, server-macos, server-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: lyrel
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Require all eight platform assets
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=(
            "lyrel-$VERSION-macos-arm64.dmg"
            "lyrel-$VERSION-macos-arm64.zip"
            "lyrel-$VERSION-windows-x86_64-setup.exe"
            "lyrel-$VERSION-windows-x86_64.zip"
            lyrel-server-linux-aarch64-musl
            lyrel-server-linux-x86_64-musl
            lyrel-server-macos-aarch64
            lyrel-server-windows-x86_64.zip
          )
          printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
          for ASSET in "${EXPECTED[@]}"; do
            [[ -f "dist/$ASSET" && ! -L "dist/$ASSET" && -s "dist/$ASSET" ]] || {
              echo "::error::missing or empty regular release asset: $ASSET"; exit 1;
            }
          done

      - name: Generate and verify checksums.txt
        working-directory: lyrel
        run: bash .github/scripts/generate-checksums.sh "$GITHUB_WORKSPACE/dist"

      - name: Assemble the draft release without overwriting published assets
        shell: bash
        run: |
          set -euo pipefail
          # 分页读取 draft，拒绝重复 tag、prerelease 与已发布版本；API 错误不视为不存在。
          release_for_tag() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -c '[.[][] | select(.tag_name == env.GITHUB_REF_NAME)]'
          }
          MATCHES="$(release_for_tag)"
          if [[ "$(jq length <<<"$MATCHES")" == 0 ]]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --notes ""
            MATCHES="$(release_for_tag)"
          fi
          jq -e 'length == 1 and .[0].draft == true and .[0].prerelease == false' <<<"$MATCHES" >/dev/null || {
            echo "::error::expected exactly one stable draft; published releases must never be changed"; exit 1;
          }
          RELEASE_ID="$(jq -r '.[0].id' <<<"$MATCHES")"
          RELEASE_API="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          # 固定 release ID，每次上传前重查 draft；永不使用 --clobber、PATCH 或 DELETE。
          # 相同字节的既有资产可复用；内容不同则停止，让负责人显式处理 draft。
          for FILE in dist/*; do
            NAME="${FILE##*/}"
            RELEASE="$(gh api "$RELEASE_API")"
            jq -e '.draft == true and .prerelease == false and .tag_name == env.GITHUB_REF_NAME' <<<"$RELEASE" >/dev/null || {
              echo "::error::release is no longer the expected stable draft"; exit 1;
            }
            ASSETS="$(gh api --paginate --slurp "$RELEASE_API/assets?per_page=100" | jq 'add')"
            EXISTING="$(jq -c --arg name "$NAME" '[.[] | select(.name == $name)]' <<<"$ASSETS")"
            COUNT="$(jq length <<<"$EXISTING")"
            if [[ "$COUNT" != 0 ]]; then
              DIGEST="sha256:$(sha256sum "$FILE" | cut -d ' ' -f1)"
              jq -e --arg digest "$DIGEST" 'length == 1 and .[0].state == "uploaded" and .[0].digest == $digest' <<<"$EXISTING" >/dev/null || {
                echo "::error::existing draft asset differs or has no verifiable digest: $NAME"; exit 1;
              }
              echo "Reusing identical draft asset: $NAME"
              continue
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" \
              -H 'Content-Type: application/octet-stream' --input "$FILE" >/dev/null
          done
          # 确认远端恰好九件资产，且逐件 SHA-256 与本次产物一致。
          gh api "$RELEASE_API" --jq '.draft and (.prerelease | not)' | grep -Fx true
          ASSETS="$(gh api --paginate --slurp "$RELEASE_API/assets?per_page=100" | jq 'add')"
          jq -r '.[].name' <<<"$ASSETS" | LC_ALL=C sort > "$RUNNER_TEMP/uploaded-assets.txt"
          printf '%s\n' checksums.txt >> "$RUNNER_TEMP/expected-assets.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/uploaded-assets.txt"
          for FILE in dist/*; do
            DIGEST="sha256:$(sha256sum "$FILE" | cut -d ' ' -f1)"
            jq -e --arg name "${FILE##*/}" --arg digest "$DIGEST" \
              'any(.[]; .name == $name and .state == "uploaded" and .digest == $digest)' <<<"$ASSETS" >/dev/null
          done
          echo "Draft assembled; CI, asset review and Chinese release notes are required before publication."
