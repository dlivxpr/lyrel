name: CI

# Windows/macOS 验证桌面与 headless；Linux 只验证 core/server/CLI，
# 包含 /proc、PTY、SSH/SFTP/GSSAPI，不构建 GUI 或桌面 updater。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job here checks out, builds, tests and greps — none of them write
# anything back to the repo, so the token needs nothing but read. The repository
# default is already `read`, but that is a settings toggle anyone with admin can
# flip; declaring it in the file is what actually pins it, and it is what
# CodeQL's `actions/missing-workflow-permissions` asks for.
permissions:
  contents: read

# A superseded PR run is dead weight the moment the next push lands, and a run
# left going is not free: the account's concurrent-job budget is shared, and
# macOS slots are the scarce ones. A zombie Windows job (see the `Test` step's
# timeout below) once held a slot for the full six-hour job limit while an
# unrelated PR's macOS job queued behind it for two and a half hours.
#
# Pushes to main are exempt: each commit's own run is the record of whether that
# commit was green, and cancelling one to start the next would erase it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # Host 边界检查独立运行；检查器使用 Node.js 标准库解析 Rust 测试模块。
  host-boundary:
    name: host boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: bash .github/scripts/check-host-boundary.sh

  # 仅跳过明确不编入程序的文档路径；不能按任意目录的 Markdown 后缀跳过，
  # 因为 include_str!/include_bytes! 可以将资源或技能文档编入二进制。
  # 当前源码没有嵌入 docs/ 或根目录 Markdown；新增这类输入时需同步此过滤器。
  # 保留矩阵 job，仅跳过步骤，确保每个目标的检查名称稳定。
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # A PR checkout is the merge commit, so its first parent is the base.
      # `--no-renames` lists both sides of a move, or `src/x.rs` -> `docs/x.md`
      # would show only the docs path.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if [ "${{ github.event_name }}" != pull_request ] \
              || grep -qvE '^docs/.*\.mdx?$|^[^/]+\.md$' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::docs-only change — Rust jobs skipped"
          fi

  build:
    name: build & test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    needs: changes
    runs-on: ${{ matrix.runner }}
    # Line tables keep file:line in backtraces but shrink the cached target dir.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
    # Backstop under the per-step timeouts below. Without any timeout at all a
    # hung test runs to GitHub's six-hour job limit, which is how a 90-second
    # step turned into a six-hour one three times in a day.
    timeout-minutes: 60
    steps:
      - name: Checkout lyrel
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      # Host 检查和 Pi 桥契约测试要求 Node.js 22.19+；setup-node 提供当前
      # runner 平台的原生 Node，Linux 不通过 Windows 的 node.exe 执行测试。
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: '22'
          package-manager-cache: false

      # GUI 使用 registry 的 gpui-kit；Windows SDK 由 runner 提供。
      # Linux headless 保留 GSSAPI 的 MIT Kerberos 构建依赖，不安装 GUI 库。
      - name: Install Linux system dependencies
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake clang libzstd-dev libssl-dev libkrb5-dev
          echo "LIBGSSAPI_IMPL=mit" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          targets: ${{ matrix.target }}

      # Saved only from main (and manual runs): a cache saved on a PR ref is
      # readable by that ref alone, while main's is readable by every branch,
      # and per-branch saves of ~2 GB per target blow the 10 GB repo quota.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true

      # Windows build.rs fails closed without the prepared ConPTY pair — the
      # same prepare entry developers run, so a broken prepare fails the build
      # step rather than degrading to the in-box conhost.
      - name: Prepare ConPTY
        if: matrix.runner == 'windows-latest' && needs.changes.outputs.code == 'true'
        shell: pwsh
        run: '& ./scripts/prepare-conpty.ps1'

      # `--locked` on the build so a Cargo.lock that disagrees with Cargo.toml
      # fails here instead of being silently rewritten. Without it the drift is
      # invisible to CI and lands on contributors instead: every local `cargo`
      # run rewrites the lock, leaving a permanently dirty working tree that has
      # to be re-discarded before every commit. The release workflow locks its
      # build too.

      - name: Build desktop and headless
        if: needs.changes.outputs.code == 'true' && runner.os != 'Linux'
        # Cold-cache builds have been observed at ~10 min; warm ones at ~90s.
        timeout-minutes: 30
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Build Linux headless
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        timeout-minutes: 30
        run: cargo build --locked --workspace --exclude lyrel --all-features --target ${{ matrix.target }}

      # A binary that imports VCRUNTIME140.dll cannot start on a Windows
      # machine that has never installed the Visual C++ Redistributable — the
      # loader fails before `main`, which is what winget's install validation
      # hit on 26.8.2 (#902). `.cargo/config.toml` links the CRT statically;
      # this is the check that it still does.
      #
      # It runs here, on the debug build, rather than only at release time:
      # every machine that builds lyrel already has the redistributable, so
      # nothing else in the pipeline can notice the regression, and the
      # dependency can come back from a single prebuilt native library or a stray
      # RUSTFLAGS (`cc`-built code follows `+crt-static` on its own).
      # Named files rather than the target directory — build scripts and
      # proc-macro artifacts under it are host units, which are built without
      # the target's rustflags and legitimately import the CRT dynamically.
      - name: Assert the Windows binaries need no VC++ redistributable
        if: needs.changes.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.github/scripts/assert-no-vcruntime.ps1 `
            "target/${{ matrix.target }}/debug/lyrel-app.exe" `
            "target/${{ matrix.target }}/debug/lyrel.exe" `
            "target/${{ matrix.target }}/debug/lyrel-server.exe"

      # `cargo test` has no timeout of its own, so one hung test is
      # indistinguishable from a slow suite until the job hits GitHub's six-hour
      # limit. The suite intermittently hangs here — roughly one run in ten, on
      # any branch, while the same commit passes on a re-run — and every time it
      # did, the job held a runner slot for hours and reported nothing.
      #
      # Seen on Windows three times and on Linux once, so it is not a
      # platform-specific test: `Build` succeeds, `Test` starts, and nothing
      # further is ever written.
      #
      # The step's honest budget is small: ~75s warm and ~3.5 min when this step
      # also has to compile the test targets, on every platform. 20 minutes is
      # pure headroom, so a trip means a hang, not a slow runner.
      - name: Test desktop and headless
        if: needs.changes.outputs.code == 'true' && runner.os != 'Linux'
        timeout-minutes: 20
        # SIGABRT 会丢失 libtest 捕获缓冲；直接保留原始 panic 和回溯。
        run: cargo test --locked --target ${{ matrix.target }} -- --nocapture

      - name: Test Linux headless
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        timeout-minutes: 20
        run: cargo test --locked --workspace --exclude lyrel --all-features --target ${{ matrix.target }}

      - name: Test desktop updater
        if: needs.changes.outputs.code == 'true' && runner.os != 'Linux'
        timeout-minutes: 10
        run: cargo test --locked --features updater --bin lyrel-updater --target ${{ matrix.target }}

      # There is deliberately no post-mortem step here, and that is worth
      # recording, because an earlier version of this file had one: on failure it
      # dumped the process table to find the surviving test binary.
      #
      # It does not work, and cannot. GitHub kills the step's whole process tree
      # when `timeout-minutes` trips, *before* the next step runs, so on the one
      # failure that matters the dump comes back empty — verified on run
      # 30526538997, where it printed two headers and nothing between them.
      #
      # Nor is it needed. libtest already prints "<test> has been running for
      # over 60 seconds" for a test that has not returned, and that line was
      # sitting in every hung run all along. The obstacle was never the
      # diagnostic: a job's log cannot be fetched while the job is in progress
      # (the API 404s), and nobody cancels a six-hour run to read one. The `Test`
      # timeout above is what fixes that — the step *fails*, so the log lands,
      # with the name in it.

  # Static musl builds of the headless server binary that remote workspaces push
  # onto the far machine (decision D10).
  # One binary has to run on any distro without regard to the target's glibc
  # version, so it is linked fully static against musl rather than built per
  # distro. Compile-only — this job publishes nothing; release.yml carries the
  # same job with an upload step.
  server-musl:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: lyrel-server musl (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    # `-C strip=symbols` is applied by rustc through the linker, so it strips the
    # aarch64 output from an x86_64 runner — plain `strip(1)` would not. Set here
    # rather than in [profile.release] because the release profile is shared with
    # the GUI builds, which keep their symbols.
    env:
      RUSTFLAGS: -C strip=symbols
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zig supplies both the musl sysroot and the C cross-compiler, which is
      # what makes one x86_64 runner able to emit both musl targets. russh's
      # default crypto backend (aws-lc-rs) builds a sizable C/asm library through
      # cmake, and that is the part every other approach trips over: `cross`
      # needs a custom image to get cmake into the sandbox, and Ubuntu's
      # `musl-tools` only ships an x86_64 `musl-gcc` wrapper with no C++ driver
      # and nothing at all for aarch64. Verified locally: both targets link
      # statically and the resulting binaries run under Alpine.
      #
      # If setup-zig ever becomes a problem (its GitHub repo is a mirror of a
      # Codeberg original), cargo-zigbuild also accepts zig from PyPI —
      # `pip3 install ziglang`, which it finds via CARGO_ZIGBUILD_PYTHON_PATH —
      # so this can drop to zero third-party actions without changing anything
      # else.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      # 单独构建 server，避免 GUI 的 feature 统一启用 GSSAPI；musl 无法
      # 链接依赖系统 MIT/Heimdal Kerberos 的 libgssapi。
      - name: Build static lyrel-server
        run: cargo zigbuild --release --locked -p lyrel-server --target ${{ matrix.target }}

      - name: Assert the binary is static
        run: bash .github/scripts/assert-static.sh "target/${{ matrix.target }}/release/lyrel-server"

  # The same headless server for remote Macs. A second job rather than more rows
  # in `server-musl`: that one exists to cross-compile from Linux with zig, and
  # neither half of it applies here — an Apple target needs an Apple runner for
  # the SDK, and there is no musl to link.
  #
  # 仅构建 Apple Silicon；独立 server 不依赖桌面 GUI 或系统 Kerberos。
  # 与 server-musl 一样仅编译、签名并检查；release.yml 负责上传资产。
  server-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: lyrel-server macOS (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
    env:
      RUSTFLAGS: -C strip=symbols
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      # 独立 server 不统一 GUI 的 GSSAPI feature；assert-macho.sh 会拒绝
      # 需要目标 Mac 额外安装 Homebrew/Kerberos 库的二进制。
      - name: Build lyrel-server
        run: cargo build --release --locked -p lyrel-server --target ${{ matrix.target }}

      # Apple Silicon 内核要求可执行文件带签名；ad-hoc 不需要凭据，
      # 也不等于 Developer ID 签名或 Gatekeeper 公证。
      - name: Ad-hoc sign the binary
        run: codesign --force --sign - "target/${{ matrix.target }}/release/lyrel-server"

      - name: Assert the binary is self-contained
        run: |
          bash .github/scripts/assert-macho.sh \
            "target/${{ matrix.target }}/release/lyrel-server" "${{ matrix.arch }}"
