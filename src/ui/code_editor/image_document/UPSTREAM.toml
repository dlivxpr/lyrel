# #282 的 Glim GIF 播放源码记录。
#
# 只移植 `glim-services/src/media.rs` 的 GIF 部分（`GifPlayback`、合成、
# disposal、循环、逐行解码与帧延时），不导入平台 ImageIO、缩略图、音频/
# 视频或 Glim 应用壳。`sha256` 是上游原始 blob 的字节摘要，不是本地改造
# 后文件的摘要；本地文件必须继续携带此 notice 与根 LICENSE 的 MIT 附录。
repository = "https://github.com/glimapp/glim"
revision = "fc2183f2c5f27ddfcdc4badbab6d83d50616831b"
license = "MIT"
copyright = "Copyright (c) 2026 Glim contributors"
maintainer = "Lyrel"
import_owner = "#282"
license_notice = "LICENSE 的 Glim-derived GIF playback appendix"

# 本地适配：
# - `GifInput::{File,Temporary}` 与本机路径/临时文件权威换成 owning Host 读到的
#   `Arc<[u8]>`；解码器与帧状态只消费这份字节。
# - 保留 RGBA 输出、`check_frame_consistency(true)`、interlace pass 顺序、
#   Keep/Background/Previous disposal、透明不覆盖、finite repeat 重开与
#   delay 0/1cs→100ms。
# - 删除上游按 ResourcePool 压力用 `fitted_dimensions` 降低合成画布分辨率的
#   路径；Lyrel 在打开时一次核准 canvas+restore+输出+行的 64 MiB 动画预算，
#   超限时文档明确拒绝，不静默降质、也不把降采样冒充 100% 实际大小。
# - 逐帧 `reserve_working` 的准入换成打开时准入，因此没有可拒绝的中途帧；
#   `pending_frame` 状态机仍原样保留，任何在 header 之后失败的路径都不会
#   越过该帧。没有累计帧数上限。
# - 帧调度、可见性、线程与纹理租约属于 Lyrel `image_document`，不导入
#   Glim ResourcePool/RasterFrame。

[[source]]
upstream = "crates/glim-services/src/media.rs"
local = "crates/lyrel-code-editor/src/image/gif.rs"
sha256 = "43194a2dada2b7d9cf3975eddd89f9d2e130a9a904347b5093d7f126871f39c0"
scope = "GIF portions only: GifPlayback state machine, compositing, disposal, repeat, incremental row decoding"

