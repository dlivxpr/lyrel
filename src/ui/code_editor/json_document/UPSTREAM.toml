bytes = 11481
local = "src/ui/code_editor/json_document/projection.rs"
status = "adapted semantics, parser replaced"
retained = "JSONC 词法边界：字符串内的 `//`／`/*` 不是注释，块注释必须闭合，尾随逗号只在不进入字符串时生效；输入大小与节点数有界，取消检查贯穿投影"
adapted = "注释／尾随逗号规则由 jsonc-parser 的 ParseOptions 表达，不再复制字节遮盖缓冲区；结构投影保留源码偏移与 occurrence，JSONL 逐行建立记录 identity"
replaced = "上游 serde_json::Value 树会丢重复键、数字原拼写和源码范围，与 #279 的保真要求冲突；Value 构造与 nodes_for_value 不导入"
not_imported = "format_document 整篇空白重排、JSON5 分支、Glim ResourcePool/Cancellation 类型"

