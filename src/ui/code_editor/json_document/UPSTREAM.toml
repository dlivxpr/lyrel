# #289 的 JSON 家族源码／依赖记录。
#
# 本模块没有复制 Glim 源文件：解析改由 registry 的无损 `jsonc-parser` 承担，
# 只适配 Glim reader 已经验证过的树展开／完整值交互。下面逐文件固定上游
# revision、原始 blob SHA-256 与保留／替换范围；sha256 是上游原始字节摘要，
# 不是本地文件摘要。Glim MIT 正文与本地通知见根 LICENSE。
