license = "MIT"
copyright = "Copyright (c) 2026 Glim contributors"
ticket = "#289"
maintainer = "Lyrel"
license_notice = "LICENSE 的 Glim-derived JSON structure inspection 附录与既有 Glim MIT 正文"

[[dependency]]
name = "jsonc-parser"
version = "=0.34.0"
registry = "crates.io"
license = "MIT"
copyright = "Copyright (c) 2020 David Sherret"
source = "https://github.com/dprint/jsonc-parser"
scope = "带源码偏移的 JSON／JSONC AST 与 token；对象属性保持 Vec 顺序，重复键不被合并，NumberLit.value 保留原拼写"
adaptation = "JSON 与 JSONC 分开设置 ParseOptions；JSONC 只放开注释与尾随逗号，其余 JSON5 扩展全部关闭。AST 只用于一次投影，节点保存源码范围与显示文本，不保存 Value"

