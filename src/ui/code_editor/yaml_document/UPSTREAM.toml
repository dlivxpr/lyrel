# #292 的 YAML 源码／依赖记录。
#
# 本模块没有复制 Glim 源文件：Glim `graph.rs` 的 YAML 分支是
# `serde_yaml_ng` → `serde_json::Value` 的有损只读投影，会丢锚点／别名／tag／
# 注释／标量样式并把多文档压成数组，明确拒绝。真正的解析与编辑使用 registry
# 的无损 `yaml-edit`；#289 已移植的树展开／可见行／源码定位继续复用。
