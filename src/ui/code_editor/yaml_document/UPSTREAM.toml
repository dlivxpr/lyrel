[[dependency]]
name = "yaml-edit"
version = "=0.3.6"
registry = "crates.io"
license = "Apache-2.0"
copyright = "Copyright (c) Jelmer Vernooĳ"
source = "https://github.com/jelmer/yaml-edit"
scope = "rowan 无损 YAML CST；多文档、mapping／sequence、scalar 原拼写、anchor／alias／tag／comment 与 byte range"
adaptation = "只启用 `default-features = false`（关闭 base64／regex 辅助）；CST 仅在 `host_ops::off_thread` 的后台闭包内存在，跨线程返回拥有型的节点范围与显示文本。树内编辑只规划 byte splice，新片段在探针中由同一 parser 校验；不把整棵 CST 序列化回写，也不经 `YamlValue`／JSON。"
not_imported = "yaml-edit 的 `binary`／`regex` feature、`YamlValue` 语义模型、整篇 `to_string()` 写回、migrate／schema 工具"

