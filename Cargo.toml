[package]
name = "lyrel"
version.workspace = true
edition = "2024"
description = "A terminal workbench: shells, persistent sessions, SSH, coding agents — GPU-rendered on GPUI Kit, pure Rust"
repository = "https://github.com/dlivxpr/lyrel"
license = "Apache-2.0"
readme = "README.md"
publish = false
default-run = "lyrel-app"

[[bin]]
name = "lyrel-app"
path = "src/main.rs"

# AppKit initialization must run on the process main thread, not a libtest worker.
[[test]]
name = "native_markdown"
path = "tests/native_markdown.rs"
harness = false
required-features = ["native-markdown-tests"]

[[test]]
name = "native_terminal"
path = "tests/native_terminal.rs"
harness = false
required-features = ["native-markdown-tests"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# The standalone updater's library half: the shared update contract (layout
# markers, backup naming, the VerifyPlan/InstallPlan argv layouts, and the
# UpdateOutcome record) consumed by this coordinator and by the
# `lyrel-updater` executable, which lives in `crates/lyrel-updater`. GPUI-free,
# like everything else at this seam.
lyrel-updater = { path = "crates/lyrel-updater" }
# The framework-free daemon and Host execution behind the protocol facade.
# `gssapi` is off in lyrel-core's defaults (a static musl `lyrel-server` cannot
# link the system krb5 it binds); the GUI, which builds against a real desktop
# toolchain, turns it on so managed SSH connections keep offering
# `gssapi-with-mic` exactly as before.
#
# `remote-install` is off there for the same shape of reason: it pulls an HTTPS
# client used only to *download* a `lyrel-server` onto a remote machine
# (decision D5). The server binary is the thing being downloaded, so it can
# never take that path; the GUI, which is the client that pushes it, can.
lyrel-core = { path = "crates/lyrel-core", features = ["gssapi", "remote-install"] }

# The shared GPUI desktop foundation: the config global wrapper, keybinding
# actions, workspace store, off-thread Host execution, theme presets, i18n,
# bounded notification history, routes and read-only snapshots. Desktop-only
# like the GUI itself; on Linux this is an empty rlib so headless workspace
# builds are unaffected.
lyrel-ui-base = { path = "crates/lyrel-ui-base" }

# GUI-free insights above the `lyrel-protocol` Host seam: the right panel's GitHub
# tab, Settings' skills/statistics/usage backends and their browser session
# readers. The GUI is this crate's only production consumer — the headless
# server and CLI never link it — so it stays a desktop-only dependency, while
# the crate itself remains Linux-buildable (browser modules gated there).
lyrel-insights = { path = "crates/lyrel-insights" }
# GUI-free structural (content-aware) diff engine: tree-sitter item matching
# over two text versions. Desktop-only by ownership — the shell is its only
# production consumer, so no grammar enters the CLI or protocol graphs.
lyrel-content-diff = { path = "crates/lyrel-content-diff" }
gpui-kit = { workspace = true }
# Only the opt-in main-thread Markdown consumer harness needs this direct edge.
lyrel-markdown-editor = { path = "crates/lyrel-markdown-editor", optional = true }
# Independent desktop clients; the window shell owns their composition.
lyrel-terminal = { path = "crates/lyrel-terminal" }
lyrel-workbench-editor = { path = "crates/lyrel-workbench-editor" }

anyhow.workspace = true
log.workspace = true
chrono = "0.4.45"
semver = "=1.0.28"
# Grapheme-cluster boundaries for the sidebar's label elision
# (`ui::tab_strip`). Cutting a label by `char` tears emoji apart: a ZWJ
# sequence loses its joiner, `❤️` loses the variation selector that makes it an
# emoji, and half a flag renders as a bare letter. Already in the tree via
# gpui, so this pins no new code.
unicode-segmentation = "1"
smol.workspace = true
smallvec.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tempfile = "3"
# LaunchServices sends files and custom URL schemes through gpui's unified
# open-URL callback. `url` keeps the decoding and SSH authority parsing here
# standards-compliant rather than treating percent escapes as literal paths,
# and `percent-encoding` — already in the tree under `url` — spells the
# userinfo and man-page names back out.
url = "2"
percent-encoding = "2"
# Clear transient form credentials when they leave scope.
zeroize = "1"
sha2 = "0.11.1"


# SSH profile ids in the connection manager UI (`ui::ssh_connect`,
# `ui::settings`, the command palette). The profiles themselves — and the
# secret-free `CredentialRef` they carry — live in `lyrel-core`, which `Config`
# needs to parse `config.json` without gpui.
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# The GUI credential vault uses the platform store on macOS and Windows.
#
# It sits here rather than in `lyrel-core` on purpose: every caller is in `ui::`
# (`ssh_prompt`, `ssh_connect`, `settings`, `app`), and leaving it downstairs made
# the headless `lyrel-server` — a static binary pushed onto machines that have no
# keychain at all — link `zbus`/`secret-service` and thirty-odd crates behind them
# for code it can never reach. Only the secret-free naming half (`CredentialRef`,
# the account scheme) stays in core, where `config.json` parsing needs it.
keyring = "4"

# Clipboard-image paste (`terminal::view`). When the clipboard holds a screenshot
# and a coding-agent TUI (Claude Code &co.) is in the pane, off macOS we stage the
# image to a temp file and paste its path — agents attach an image path the same way
# they do a drag-drop. Windows screenshots arrive as BMP (`CF_DIB`), which agent
# vision won't accept, so we transcode to PNG. `image` is already in the tree via
# gpui's own clipboard code, so pinning it here adds no new native code.
image = "0.25"

# The published transport shares gpui-pre-http-client types with Fast through Kit.
# Its library name is `reqwest_client`; it owns its Tokio runtime.
gpui-pre-reqwest-client = "=0.3.12"
ureq = { version = "3", default-features = false, features = ["rustls", "win-system-proxy", "socks-proxy"] }

# See `[workspace.dependencies]`: the pin is shared with lyrel-cli, which parses
# `capture` output through the same grid.
rio-vt.workspace = true



# Filesystem watcher for live config reload: watches `config.json` and reloads
# `Config` + re-applies the theme without a restart. The code panel (file tree /
# editor, `ui::code`) reuses it to refresh the tree and detect external edits.
notify = "8"

# Rasterize tray and document SVGs; file-editor resource policy supplies safe resolvers.
# Kit's own published SVG versions remain unpatched.
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "raster-images", "svgz"] }

# Native tray on Windows and macOS.
tray-icon = "0.26.1"

# `core::cli_install` edits HKCU\Environment to put the bundled CLI on PATH.
# `setx` is not an option there: it truncates at 1024 characters, so a long user
# PATH comes back mangled. 0.61 is already in the tree (tray-icon pulls it), so
# this pins no new code.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    # ConvertStringSecurityDescriptorToSecurityDescriptorW + SECURITY_ATTRIBUTES:
    # the elevated updater's %ProgramData% staging directory gets an explicit
    # admin-only DACL (see `create_dir_admin_only` in lyrel-updater).
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    # `MessageBeep` (the terminal bell in `terminal::view`) is a user32 export,
    # but the Win32 metadata files it under Diagnostics::Debug, so that is the
    # module the binding needs — nothing here pulls in dbghelp.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    # `SetThreadExecutionState` (Caffeine's idle-sleep hold in `ui::caffeine`):
    # the process-wide ES_CONTINUOUS | ES_SYSTEM_REQUIRED request, deliberately
    # without ES_DISPLAY_REQUIRED so display sleep and lock stay on system policy.
    "Win32_System_Power",
    "Win32_System_Console",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Backdrop materials (`ui::backdrop`): the documented DwmSetWindowAttribute
    # for DWMWA_SYSTEMBACKDROP_TYPE, and LibraryLoader to resolve user32's
    # SetWindowCompositionAttribute the same way the gpui backend does.
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }
# The window's public `HasWindowHandle` handle is how `ui::backdrop` reaches
# the HWND for the DWM calls, and how the Side Panel browser (`ui::browser`)
# anchors its native child. Already in the tree at 0.6 via gpui itself.
raw-window-handle = "0.6"
# The Side Panel browser's WebView2 child surface (`ui::browser::surface`).
# The same pinned line the draw.io document engine uses; wry is not used on
# Windows because this surface needs WebView2's own permission, popup and
# `IsUserInitiated` answers.
webview2-com = "=0.39.1"
# Windows dictionary segmentation; macOS uses CFStringTokenizer instead.
# COM for toast branding (`core::aumid`): IShellLinkW + IPropertyStore stamp
# System.AppUserModel.ID onto the Start Menu shortcut, which Windows requires
# before it honors an unpackaged app's toast identity (otherwise the toast
# backend falls back to PowerShell's). Keep the published 0.62 binding line.
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    # ITaskbarList3's numeric taskbar overlay (#397): the shell interface and
    # the GDI calls that draw the 1–9/9+ icon, over the COM apartment GPUI's
    # Windows backend already initializes.
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_EnhancedStorage",
    # IShellLinkW::GetPath takes a WIN32_FIND_DATAW, so reading an existing
    # shortcut's target back — which is how `aumid` decides whether it has to
    # write at all — needs the file-system bindings too.
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Variant",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62.2"

# Embeds `assets/favicon.ico` into the `.exe` so Windows shows the lyrel logo in
# the taskbar / window / Explorer (macOS gets its icon from the `.app` bundle via
# bundle.sh instead). Only needed at build time on Windows — see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# gpui only *reads* the macOS window appearance; it never sets it. We force the
# app appearance to match the active theme (see `ui::theme::sync_native_appearance`)
# so the native traffic-light buttons render in the right light/dark style.
[target.'cfg(target_os = "macos")'.dependencies]
# The Side Panel browser's WKWebView child surface (`ui::browser::surface`).
# The same pinned line the draw.io document engine uses; no custom protocol
# or IPC handler is installed for the browser.
wry = { version = "=0.57.2", default-features = false }
raw-window-handle = "0.6"
# CFStringTokenizer FFI for dictionary-based CJK word segmentation on
# double-click (`terminal::smart_select`). Already in the tree transitively,
# and it makes the Windows jieba fallback unnecessary here.
core-foundation = "0.10.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSAppearance", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSSpellChecker", "NSDockTile"] }
# NSData feeds the runtime Dock icon for bare (non-bundled) binaries — see
# `set_dock_icon_for_bare_binary` in main.rs.
# NSUserNotification is the click-to-reveal notification path — see
# `terminal::remote::macos_notify` for why it is driven directly.
# NSUserDefaults (with NSDictionary for the domain it returns) is how a test
# checks that `font_thicken: false` leaves `AppleFontSmoothing` alone — see
# `ui::platform`.
# NSMenu/NSMenuItem back the native-menu key-equivalent repair in
# `ui::theme::fix_native_menu_key_equivalents` (gpui 0.3.9 does not map
# "enter"/"tab", so the app rewrites those equivalents itself).
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSString", "NSUserDefaults", "NSUserNotification", "NSLocale", "NSArray", "NSRange"] }
# `oneshot::Receiver` appears in the `Platform` trait's prompt/screen-capture
# signatures, which the full-delegation wrapper in `ui::platform` must name.
# Already in the tree at 0.3.34 via gpui.
futures-channel = "0.3"


# The Kit test-support feature enables its real App/Window test harness.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
lyrel-core = { path = "crates/lyrel-core", features = ["test-support"] }
lyrel-insights = { path = "crates/lyrel-insights", features = ["test-support"] }
# Test builds turn the foundation's scratch-config guards on (the
# cross-crate `test-guards` feature); release builds never see them.
lyrel-ui-base = { path = "crates/lyrel-ui-base", features = ["test-guards"] }
# The editor-session store's read/write guards follow the same cross-crate
# contract: root test builds compile the workbench editor without `cfg(test)`,
# so the `test-support` feature carries the guard instead.
lyrel-workbench-editor = { path = "crates/lyrel-workbench-editor", features = ["test-support"] }
# Shared PTY/graphics/native-SSH fixtures and the graphics-fixture process
# (the `lyrel-graphics-fixture` binary target of this package).
lyrel-test-support = { path = "crates/lyrel-test-support" }
# The terminal client's test surface (rooted-consumer graphics helpers, quiet
# test panes) the whole-window and native consumer suites build on.
lyrel-terminal = { path = "crates/lyrel-terminal", features = ["test-support"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
# Workbench fixtures encode images and inspect the lossless YAML tree.
gif = "0.14.2"
# Whole-window snapshot-harness tests build glyph outlines for the production
# TerminalElement paint path (the terminal crate re-exports the paint side
# only in its own tests).
rio-graphics.workspace = true
tiff = "0.11.3"
yaml-edit = { version = "=0.3.6", default-features = false }
# Format and Markdown tests exercise the real document types and fixture engines.
lyrel-document = { path = "crates/lyrel-document", features = ["formats", "test-fixtures"] }
lyrel-markdown-editor = { path = "crates/lyrel-markdown-editor" }
lsp-types = { version = "0.97.0", features = ["proposed"] }
encoding_rs.workspace = true
# Browser import moved to `lyrel-insights`, but the desktop workflow tests and
# the SQLite document fixtures still build real SQLite databases themselves —
# a dev-only dependency, never linked into the released GUI.
rusqlite = { version = "0.42.0", features = ["bundled"] }

[lints]
workspace = true

[features]
default = []
test-support = [
    "lyrel-core/test-support",
    "gpui-kit/test-support",
    "lyrel-terminal/test-support",
]
# The native test binaries call `pin_test_config_dir`, which now lives in
# `lyrel-ui-base`; the feature keeps the foundation's guards available in
# exactly the builds that can call it (test builds get them from the
# dev-dependency instead).
native-markdown-tests = [
    "test-support",
    "lyrel-ui-base/test-guards",
    "lyrel-terminal/native-markdown-tests",
    "lyrel-workbench-editor/native-markdown-tests",
    "dep:lyrel-markdown-editor",
]

# Shared pins keep the GUI and its consumers on one published framework chain.
[workspace]
# 含根包共 13 个成员：协议与会话核心、领域引擎、桌面应用、仅测试支持。
members = ["crates/*"]
# 默认成员面向 Windows/macOS；此清单不随构建目标变化。
# Linux headless 用 CI 与安装指南中的 --workspace --exclude 显式选包。
default-members = [".", "crates/lyrel-ui-base", "crates/lyrel-terminal", "crates/lyrel-workbench-editor", "crates/lyrel-markdown-editor", "crates/lyrel-document", "crates/lyrel-insights", "crates/lyrel-protocol", "crates/lyrel-core", "crates/lyrel-server", "crates/lyrel-cli", "crates/lyrel-updater"]

[workspace.package]
edition = "2024"
# 所有一起发布的 workspace 成员通过 version.workspace 继承此版本。
# 发布时只修改这一处，不将应用版本与 IPC 协议版本混用。
version = "0.4.1"

[workspace.dependencies]
encoding_rs = "0.8.44"

# The public facade selects Fast consistently for component, base, assets and platform.
gpui-kit = { version = "=0.10.0", features = ["gpui-fast"] }

# 正式 Rio VT parser + grid 同时供 GUI 镜像、CLI capture 和 daemon 图片状态使用。
# 共享版本保证三个消费者的光标与字符单元语义一致；PTY 仍由 portable-pty 驱动。
#
# Only the parser/grid library is taken: Rio's own PTY, windowing and
# Sugarloaf renderer stay out (`default-features = false`), and the keyboard
# mode stacks the daemon folds for replay stay in `lyrel-protocol`'s `term_modes`.
rio-vt = { version = "=0.5.32", default-features = false }
# Unicode segmentation and width primitives match the pinned Rio grid.
rio-unicode = "=0.5.32"
rio-grapheme-width = "=0.5.32"
# Types plus the released `glyf` outline decoder and registry. `glyph` adds
# skrifa/parking_lot only — no Rio renderer, PTY or image stack. The daemon
# validates and retains registrations with it; the GUI decodes accepted bodies
# for its derived picture.
rio-graphics = { version = "=0.5.32", features = ["glyph"] }

anyhow = "1"
log = "0.4"
serde = { version = "1.0.219", features = ["derive"] }
yaml_serde = "=0.10.7"
serde_json = "1.0.154"
smallvec = "1.16.3"
smol = "2"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"

[profile.dev]
# Keep debug/test dependency code and unwind records bounded without linker overrides.
opt-level = 1
codegen-units = 256
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
gpui-fast-macros = { opt-level = 3 }
gpui-fast-windows = { opt-level = 3 }
gpui-fast-macos = { opt-level = 3 }
gpui-fast-apple = { opt-level = 3 }
# The VT parser + grid run on every PTY byte; at opt-level 0 a `cat bigfile`
# crawls under `cargo dev`.
rio-vt = { opt-level = 3 }

# The render/parse hot path crosses the lyrel ↔ rio-vt ↔ gpui crate
# boundaries, so cross-crate inlining (thin LTO, like Zed ships) buys real
# throughput there; single codegen unit for the same reason.
[profile.release]
lto = "thin"
codegen-units = 1

