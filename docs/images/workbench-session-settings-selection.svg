<svg xmlns="http://www.w3.org/2000/svg" width="752" height="408" viewBox="0 0 752 408" role="img" aria-label="会话设置 A 版。左侧勾选五条会话，右侧标出两条暂不可删除的原因，底部的删除按钮显示可删除的三条。">
  <style>
    :root {
      --fg: #1c1c1e;
      --muted: #55555b;
      --border: #a2a2a8;
      --surface: #e8e8ed;
      --accent: #1558ae;
      --warning: #8b4a12;
      --error: #a91f30;
      --c1: #2462b3;
      --c2: #296c55;
      --c3: #7040a0;
      --c4: #8b4a12;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ececed;
        --muted: #b6b6be;
        --border: #686870;
        --surface: #303037;
        --accent: #8cb7ff;
        --warning: #ffbf83;
        --error: #ff8d9a;
        --c1: #8cb7ff;
        --c2: #7bd7ae;
        --c3: #c5a4ff;
        --c4: #ffbf83;
      }
    }
  </style>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="var(--fg)">
    <rect x="1" y="1" width="750" height="406" rx="8" fill="none" stroke="var(--border)"/>
    <path d="M1 44h750M1 88h750M416 88v319M14 153h388M434 152h302M434 354h302" fill="none" stroke="var(--border)"/>
    <text x="17" y="28" font-size="16" font-weight="600">会话</text>
    <g fill="var(--surface)">
      <rect x="609" y="10" width="127" height="25" rx="5"/>
      <rect x="14" y="52" width="180" height="27" rx="5"/><rect x="202" y="52" width="112" height="27" rx="5"/>
      <rect x="322" y="52" width="168" height="27" rx="5"/><rect x="498" y="52" width="238" height="27" rx="5"/>
      <rect x="14" y="96" width="50" height="25" rx="5"/>
      <rect x="14" y="160" width="388" height="39" rx="5"/>
      <rect x="14" y="202" width="388" height="39" rx="5"/>
      <rect x="14" y="244" width="388" height="39" rx="5"/>
      <rect x="14" y="286" width="388" height="39" rx="5"/>
      <rect x="14" y="328" width="388" height="39" rx="5"/>
      <rect x="434" y="365" width="134" height="29" rx="6"/>
    </g>
    <text x="620" y="28">dev-linux</text><text x="721" y="28" text-anchor="end" fill="var(--muted)">▾</text>
    <g font-size="13">
      <text x="25" y="70" fill="var(--muted)">搜索标题或 ID</text><text x="213" y="70">全部智能体 ▾</text>
      <text x="333" y="70">最近活动　不限 ▾</text><text x="509" y="70">目录　所有目录 ▾</text>
      <text x="39" y="113" text-anchor="middle" font-weight="600">会话</text><text x="76" y="113" fill="var(--muted)">已隐藏</text>
      <text x="46" y="143">全选当前结果</text><text x="390" y="143" text-anchor="end" fill="var(--muted)">5 条</text>
    </g>
    <g fill="var(--accent)">
      <rect x="22" y="130" width="15" height="15" rx="3"/>
      <rect x="22" y="169" width="15" height="15" rx="3"/>
      <rect x="22" y="211" width="15" height="15" rx="3"/>
      <rect x="22" y="253" width="15" height="15" rx="3"/>
      <rect x="22" y="295" width="15" height="15" rx="3"/>
      <rect x="22" y="337" width="15" height="15" rx="3"/>
    </g>
    <path d="M25 137l3 3 6-6m-9 42 3 3 6-6m-9 45 3 3 6-6m-9 45 3 3 6-6m-9 45 3 3 6-6m-9 45 3 3 6-6"
      fill="none" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="178">排查构建失败</text>
    <text x="46" y="220">检查远端进程归属</text>
    <text x="46" y="262">更新会话恢复说明</text>
    <text x="46" y="304">整理工作树命令</text>
    <text x="46" y="346">检查缓存清理日志</text>
    <g fill="var(--muted)" font-size="12">
      <text x="46" y="193">Oh My Pi · ~/dev/lyrel</text>
      <text x="46" y="235">OpenCode · ~/dev/lyrel-monitor</text>
      <text x="46" y="277">pi · ~/dev/lyrel</text>
      <text x="46" y="319">Kimi Code · ~/dev/lyrel</text>
      <text x="46" y="361">Hermes · ~/dev/lyrel</text>
      <g text-anchor="end">
        <text x="390" y="193">刚刚</text>
        <text x="390" y="235">昨天</text>
        <text x="390" y="277">3 天前</text>
        <text x="390" y="319">4 天前</text>
        <text x="390" y="361">5 天前</text>
      </g>
    </g>
    <text x="434" y="116" font-size="15" font-weight="600">已选 5 条会话</text>
    <text x="736" y="116" text-anchor="end" font-size="12" fill="var(--muted)">取消选择</text>
    <circle cx="438" cy="136" r="3" fill="var(--warning)"/>
    <text x="448" y="140" font-size="12" fill="var(--muted)">其中 2 条暂不可删除</text>
    <g font-size="13">
      <text x="434" y="176">排查构建失败</text>
      <text x="434" y="215">检查远端进程归属</text>
      <text x="434" y="254">更新会话恢复说明</text>
      <text x="434" y="293">整理工作树命令</text>
      <text x="434" y="332">检查缓存清理日志</text>
    </g>
    <g text-anchor="end" font-size="12" fill="var(--muted)">
      <text x="736" y="176">会话运行中</text>
      <text x="736" y="215">来源不支持删除</text>
    </g>
    <text x="501" y="384" text-anchor="middle" font-size="13">在 Lyrel 中隐藏</text>
    <rect x="578" y="365" width="158" height="29" rx="6" fill="none" stroke="var(--border)"/>
    <text x="657" y="384" text-anchor="middle" font-size="13" fill="var(--error)">删除 3 条原生会话</text>
  </g>
</svg>
