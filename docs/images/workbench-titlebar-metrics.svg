<svg xmlns="http://www.w3.org/2000/svg" width="750" height="56" viewBox="0 0 750 56" role="img" aria-label="顶栏右侧按钮组左边依次排列 CPU、RAM 和 GPU，每项包含短趋势和当前数值">
  <style>
    :root {
      --fg: #1c1c1e;
      --muted: #55555b;
      --border: #a2a2a8;
      --surface: #e8e8ed;
      --accent: #1558ae;
      --error: #a91f30;
      --c1: #2462b3;
      --c2: #296c55;
      --c3: #7040a0;
      --c4: #8b4a12;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ececed;
        --muted: #b6b6be;
        --border: #686870;
        --surface: #303037;
        --accent: #8cb7ff;
        --error: #ff8d9a;
        --c1: #8cb7ff;
        --c2: #7bd7ae;
        --c3: #c5a4ff;
        --c4: #ffbf83;
      }
    }
  </style>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="var(--fg)" font-size="14">
    <rect x="1" y="1" width="748" height="54" rx="8" fill="none" stroke="var(--border)"/>
    <text x="18" y="34" font-weight="600">Lyrel</text>
    <g fill="var(--surface)">
      <rect x="66" y="14" width="88" height="28" rx="6"/><rect x="307" y="14" width="96" height="28" rx="6"/>
      <rect x="410" y="14" width="119" height="28" rx="6"/><rect x="536" y="14" width="94" height="28" rx="6"/>
      <rect x="637" y="14" width="96" height="28" rx="6"/>
    </g>
    <g fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="77" y="23" width="14" height="11" rx="2"/><path d="M82 23v11"/>
      <circle cx="109" cy="27" r="4.5"/><path d="m112.5 30.5 3 3M129 28h10m-5-5v10"/>
      <rect x="647" y="23" width="14" height="11" rx="2"/><path d="M654 23v11"/>
      <rect x="678" y="23" width="14" height="11" rx="2"/><path d="M678 28.5h14"/>
      <rect x="709" y="23" width="14" height="11" rx="2"/><path d="M717 23v11"/>
    </g>
    <g font-family="Consolas, monospace" font-size="12">
      <g fill="var(--muted)"><text x="316" y="32">CPU</text><text x="419" y="32">RAM</text><text x="545" y="32">GPU</text></g>
      <g text-anchor="end" font-weight="600"><text x="392" y="32">12%</text><text x="518" y="32">13.1 GB</text><text x="619" y="32">8%</text></g>
    </g>
    <path d="M343 33v-4m5 4v-7m5 7v-5m5 5v-10m5 10v-7" stroke="var(--c1)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M446 32h5l4-2 4 1 4-3 5 1 4-3" fill="none" stroke="var(--c2)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M573 32h5l4-1 4-5 4 5 4 1h4" fill="none" stroke="var(--c3)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
