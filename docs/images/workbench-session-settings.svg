        --fg: #ececed;
        --muted: #b6b6be;
        --border: #686870;
        --surface: #303037;
        --accent: #8cb7ff;
        --error: #ff8d9a;
        --c1: #8cb7ff;
        --c2: #7bd7ae;
        --c3: #c5a4ff;
        --c4: #ffbf83;
