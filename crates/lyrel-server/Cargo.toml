[package]
name = "lyrel-server"
version.workspace = true
edition.workspace = true
description = "lyrel's headless session server: the persistent terminal daemon, with no GUI attached"
repository = "https://github.com/dlivxpr/lyrel"
license = "Apache-2.0"
publish = false

[[bin]]
name = "lyrel-server"
path = "src/main.rs"

# One dependency, on purpose. This binary exists to prove — and keep proving —
# that everything a lyrel session needs runs without gpui: if it ever grows a
# second dependency that the GUI also needs, that dependency belongs in
# `lyrel-core` instead.
[dependencies]
lyrel-core = { path = "../lyrel-core" }

# The end-to-end proof (`tests/stdio_conformance.rs`) runs `lyrel-core`'s shared
# `Host` conformance suite against a *real* `lyrel-server --stdio` child process.
# It has to live in this crate because that is the crate that owns the binary —
# `CARGO_BIN_EXE_lyrel-server` only exists for its own tests.
[dev-dependencies]
# Sandboxes for the suite: an empty directory per case, removed on drop. The
# server is on this machine, so a local temp dir is a path in its namespace.
tempfile = "3"
# `tests/daemon_stop.rs` probes and, on failure, kills the daemon it spawned;
# a pid needs `kill(2)`, which `Child` cannot express once ownership has moved
# to the thread collecting the exit.
libc = "0.2.191"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[lints]
workspace = true
