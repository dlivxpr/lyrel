[package]
name = "lyrel-workbench-editor"
version.workspace = true
edition = "2024"
description = "Lyrel's desktop document and code workbench: EditorPanelState, format views, Markdown host providers, offline draw.io surfaces and the LSP client. Desktop-only, free of terminal code."
repository = "https://github.com/dlivxpr/lyrel"
license = "Apache-2.0"
publish = false

[features]
# Mirrors the root package's native consumer feature: compiles the Markdown
# workbench's test-support providers (image host fixtures, shared-host
# lifecycles) without `cfg(test)` so the root `native_markdown` binary can
# run them on the process main thread. Production builds never enable it.
native-markdown-tests = []
# Turns the store's scratch-config guards on for the root package's test
# builds, which compile this crate as a dependency (no `cfg(test)`); mirrors
# `lyrel-ui-base/test-guards`.
test-support = ["lyrel-ui-base/test-guards"]

# Desktop-only workbench, mirroring the root package: everything below the
# line compiles only on Windows/macOS. On Linux this crate is an empty rlib
# so headless workspace builds are unaffected.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
lyrel-protocol = { path = "../lyrel-protocol" }
# Host value types and local-host helpers only: the Markdown image proxy
# resolver is injected by the desktop shell (`ImageProxyResolver`), so this
# crate links none of the installer's `remote-install` machinery.
lyrel-core = { path = "../lyrel-core" }
# The shared GPUI desktop foundation: config global, actions, HostOps,
# HostRegistry, i18n, notifications, presets and the shared dialog chrome.
lyrel-ui-base = { path = "../lyrel-ui-base" }
# All GUI-free document engines (text codec, structured projections, CSV,
# GIF/TIFF, draw.io probe, EPUB reading + full-book search, read-only PDF).
lyrel-document = { path = "../lyrel-document", features = ["formats"] }
lyrel-markdown-editor = { path = "../lyrel-markdown-editor" }
gpui-kit = { workspace = true, features = ["tree-sitter-languages"] }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
smallvec.workspace = true
parking_lot = "0.13"
tempfile = "3"
sha2 = "0.11.1"
similar = { version = "=3.2.1", default-features = false }
encoding_rs.workspace = true
regex = "1"
unicode-segmentation = "1"
uuid = { version = "1.28.0", features = ["v4"] }
getrandom = "0.3.4"
image = "0.25"
url = "2"
# Remote Markdown image previews fetch through the desktop proxy
# configuration; the GUI already links this client.
ureq = { version = "3", default-features = false, features = ["rustls", "win-system-proxy", "socks-proxy"] }
percent-encoding = "2"
notify = "8"
yaml-edit = { version = "=0.3.6", default-features = false }
tree-sitter = "=0.26.13"
lsp-types = { version = "0.97.0", features = ["proposed"] }
# Native Mermaid families and safe SVG output; no browser, Node.js or ELK runtime.
merman = { version = "=0.9.2", default-features = false, features = ["all-diagrams", "complete-svg"] }
# Safe SVG decode/raster for Markdown image resources and the Mermaid pipeline.
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "raster-images", "svgz"] }

[target.'cfg(windows)'.dependencies]
# The draw.io preview's WebView2 child surface. No general browser is exposed;
# wry is deliberately not used on Windows because it cannot enforce the
# resource, permission and file-panel policy this surface requires.
webview2-com = "=0.39.1"
# webview2-com's COM API surface (`ICoreWebView2::cast`, `HWND` interop).
windows = "0.62"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The draw.io preview's macOS child surface: a real WKWebView for this one
# engine, with the same strict resource filter as the Windows WebView2 host.
wry = { version = "=0.57.2", default-features = false }
raw-window-handle = "0.6"
# Core Foundation strings for the LaunchServices default-browser lookup.
core-foundation = "0.10.1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
lyrel-ui-base = { path = "../lyrel-ui-base", features = ["test-guards"] }

[lints]
workspace = true
