[package]
name = "lyrel-pdf"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false
description = "Lyrel's GUI-free Zorite-derived PDF reading backend"

[dependencies]
# Pure-Rust rasterizer and syntax layer; the pinned Zorite viewer also uses 0.8.
# Default features keep the embedded standard fonts and CMaps, so no system font
# is required on any desktop target.
hayro = "=0.8.0"
log.workspace = true

# Test fixtures build their own password-protected Standard R2 PDF. This is
# optional so the released library never links a hashing implementation; the
# dev-dependency makes the same helper available to this crate's unit tests.
md5 = { version = "0.8", optional = true }

[dev-dependencies]
md5 = "0.8"

[features]
test-fixtures = ["dep:md5"]

[lints]
workspace = true
