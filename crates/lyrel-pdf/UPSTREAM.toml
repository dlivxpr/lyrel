# 本地适配：GUI-free crate，仅保留解析、页尺寸、单页光栅化、页窗口与缩放纯函数、
# 文本层、outline/link 与只读表单描述；所有 GPUI 视图、chrome、交互与保存写回均不导入。
# 页渲染输入改为 owning Host 已读取的不可变字节；每位视图自行持有页/缩放/位图窗口。
# 明确排除上游 set_form_value、normalize_form_appearances、文本/高亮编辑与 GPL 应用代码。
# 文本层修复：locate 的 UTF-8 字节推进、裁剪栈、单栏阅读顺序、Type3 前进宽度与 CJK 空格；
# outline 补齐 named destination（Names/Dests 与旧式 Dests）和目的地坐标，旋转页链接按
# 页面初始变换归一化；无 /AP 表单只输出解密后的字段值与几何，由 Lyrel 叠加只读文本，
# 不再把 WinAnsi 合成外观写回字节。
# src/lib.rs、src/fixtures.rs 为 Lyrel 原创适配/测试夹具；未修改 hayro 或 Cargo 缓存。
# #285：上游 GPUI 侧的选择/搜索/大纲交互未导入，Lyrel `PdfView` 以归一化几何重实现；
# src/text.rs 的选择矩形/选字/`find_matches`/阅读顺序、`src/outline.rs` 的大纲/目的地/
# 链接由本票直接消费；`ligature_text_document` 夹具为 Lyrel 原创（Type3 多码点 glyph）。

