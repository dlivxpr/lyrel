# The thin console CLI: the `lyrel` on the user's PATH.
# A control/pane-protocol client of lyrel-server — the GUI is never required.
# Kept apart from the GUI binary on purpose (subsystem, upgrade file locks,
# millisecond cold start).
[package]
name = "lyrel-cli"
version.workspace = true
edition.workspace = true
description = "lyrel's command line: a thin client for the lyrel server — workspaces, tabs, panes, agents, no GUI required"
repository = "https://github.com/dlivxpr/lyrel"
license = "Apache-2.0"
publish = false

[[bin]]
name = "lyrel"
path = "src/main.rs"

[dependencies]
# Protocol types and the shared Rio cluster-width helper. No gssapi or
# remote-install: this client never links krb5 or an HTTP fetcher.
lyrel-core = { path = "../lyrel-core", features = ["terminal-width"] }

anyhow.workspace = true
serde_json.workspace = true

# The command grammar. Not in [workspace.dependencies] because this is its only
# user, same as the GUI package's own single-user pins (regex, memchr, …).
clap = { version = "4", features = ["derive"] }

# The VT parser behind `capture --plain`. A pane's replay is a byte stream, and
# recovering the text from it is a terminal's job, not a regex's: only the grid
# knows that a break at column 120 was a wrap rather than a newline, that a CR
# meant "overwrite this line", or which cell a wide char and its spacer share.
# The same crate the GUI renders with, at the same version, so the two agree
# about what a pane says.
rio-vt.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3"

# The e2e harness puts its throwaway daemon in a Job Object wired to
# KILL_ON_JOB_CLOSE, so a hard-killed test run cannot leak servers.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
] }

# The end-to-end suite drives the compiled lyrel.exe against a real isolated
# server; its own main doubles as that server process, so no libtest harness.
[[test]]
name = "cli_e2e"
harness = false

[lints]
workspace = true
