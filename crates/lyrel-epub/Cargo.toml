[package]
name = "lyrel-epub"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "GUI-free DRM-free reflowable EPUB parsing for Lyrel (ported from Glim, MIT)"

[dependencies]
# Ordinary registry dependencies. `zip` is pinned to the revision Lyrel's
# reading code was reviewed against; no Git, path or patched source is used.
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
roxmltree = "0.21.2"
encoding_rs = "0.8.44"
html-escape = "0.3.1"
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
