[package]
name = "lyrel-code-editor"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "GUI-free structured document engines shared by Lyrel's code editor (JSON/JSONC/JSONL, TOML, YAML, XML, CSV/TSV, images, draw.io)"

[dependencies]
# Lossless, source-linked JSON/JSONC AST and token ranges. JSON5 stays out.
jsonc-parser = "=0.34.0"
# Format-preserving TOML parse tree; the immutable `Document::parse` keeps spans.
toml_edit = "0.25.19"
# Lossless YAML CST with source ranges, anchors, aliases and tags.
yaml-edit = { version = "=0.3.6", default-features = false }
# The rowan version `yaml-edit` exposes for its syntax node types.
rowan = "0.16"
# Position-preserving XML tokens; roxmltree validates well-formedness and
# namespace bindings. Neither parser gets a DTD or an external resolver.
xmlparser = "=0.13.6"
roxmltree = "0.21"
# CSV/TSV record reader (quoted delimiters, embedded newlines, ragged records).
csv = "1.4.0"
# Fixed draw.io document identity digest.
sha2 = "0.11.1"
# GIF animation and multi-page TIFF decoders, using the same image-rs release
# as the GUI's static image decoder.
image = { version = "0.25", default-features = false }
gif = "0.14.2"
tiff = "0.11.3"

[lints]
workspace = true
