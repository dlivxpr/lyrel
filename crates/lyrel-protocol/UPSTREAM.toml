notes = """保留 reserve_working(minimum, desired) 的先记账后分配与 WorkingPressure：
竞争读取不能同时认领同一容量，低于 minimum 时显式失败而不是静默缩小。
Lyrel 适配：单一传输账本、固定预算常量；去掉 ResourcePool 的 State/Cache 类目、
LRU 回收、reclaim 弱引用与 macOS 内存余量回调；图片解码后的像素缓存仍由现有
markdown::images lease 记账。"""

