sha256 = "ae1c3c2758eb1ba8b03bcae29fa08e22ab3d6d4a7f2df77291aa230e90adbde8"
notes = """保留 Cancelled、CancelToken（上游 Cancellation）、CancelOnDrop 的
链式取消语义：克隆共享同一组标志，linked 合并两组，check 是逐段读取的取消点。
Lyrel 适配：去掉 anyhow、Reader/RecordReader/SwitchReader 与 commands 运行辅助
（本票没有这些消费者），并把显式 cancel() 暴露给关闭/替换目标的 UI 所有者。"""

