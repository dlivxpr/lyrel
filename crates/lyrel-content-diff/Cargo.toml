[package]
name = "lyrel-content-diff"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND MIT"
publish = false
description = "GUI-free structural (content-aware) diff engine for Lyrel: tree-sitter item extraction and conservative move/modify/add/delete matching over two text versions"

[dependencies]
# The same grammar versions the pinned gpui-component resolves, so the shared
# Cargo.lock entries are reused unchanged. Grammars never enter the CLI or
# protocol production graphs: the only production consumer is the desktop
# shell (`lyrel`).
tree-sitter = "=0.26.13"
tree-sitter-rust = "0.24.0"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.23.6"
tree-sitter-go = "0.23.4"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.1"
# Slice-level Myers diff, same pinned version and feature set the editor
# gutter already builds with.
similar = { version = "=3.2.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
