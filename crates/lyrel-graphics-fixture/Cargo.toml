[package]
name = "lyrel-graphics-fixture"
version.workspace = true
edition.workspace = true
description = "Lightweight real-daemon and real-PTY fixture process for the desktop graphics consumer tests"
repository = "https://github.com/dlivxpr/lyrel"
license = "Apache-2.0"
publish = false

# A real process, not a libtest target: the desktop consumer tests spawn this
# binary for the daemon and for each PTY producer. `test = false` keeps
# `cargo test` from building or running a harness for it.
[[bin]]
name = "lyrel-graphics-fixture"
path = "src/main.rs"
test = false

# Keep these features identical to the root GUI's lyrel-core dependency: the
# fixture must be able to share the test build's core artifacts instead of
# compiling a second, differently-featured core (and every GUI crate above it)
# on first use. `test-support` mirrors the workspace's unified test graph
# (`--features test-support` on the root package), which enables tokio's
# `test-util` for lyrel-core.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
lyrel-core = { path = "../lyrel-core", features = [
    "gssapi",
    "remote-install",
    "github",
    "terminal-width",
    "test-support",
] }

# The helper is only consumed by the desktop tests, but the crate is a
# workspace member: keep a headless Linux build (CI builds every member)
# possible without enabling the desktop-only GSSAPI dependency.
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
lyrel-core = { path = "../lyrel-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
sha2 = "0.11.1"

[lints]
workspace = true
