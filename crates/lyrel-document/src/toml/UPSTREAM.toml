[[dependency]]
name = "toml_edit"
version = "=0.25.19"
registry = "crates.io"
license = "MIT OR Apache-2.0"
copyright = "Copyright (c) 2017-2026 toml-rs contributors"
source = "https://github.com/toml-rs/toml"
scope = "format-preserving TOML parse tree with source spans, decor, date/time and ordinary/inline table forms; `Document<S>::parse` keeps the parsed raw representation"
adaptation = "Read-only projection and mutation planning use `Document::parse(&str)` and its spans. `DocumentMut` is deliberately not used for original ranges because `into_mut()` calls `despan()` unconditionally. New fragments are validated with the same parser, then spliced through Lyrel's shared `Document::replace_ranges`; the whole document is never serialized back."
not_imported = "`serde` feature, mutable `DocumentMut` write-back, formatter/normalization and any `to_string()` of the whole document as a save path"

