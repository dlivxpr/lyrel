[[extension]]
ticket = "#293"
status = "added the missing TOML layer over the #289/#290 shared tree and edit panel"
retained = "#289 的可见行／导航／源码定位语义、每文档单 worker 与 revision 安装；#290 的 `StructureEditPanel` 单／双字段面板与共享 `Document` 的 history、保存、另存为、冲突和关闭"
adapted = "`crates/lyrel-document/src/toml/projection.rs` 用 `toml_edit::Document::parse` 一次读取当前 LF 源码，保存每节点的值/键/header 行与直接语句归属；ordinary table、inline table、AoT entry、dotted 和 quoted key 各保留自己的字面拼写。`crates/lyrel-document/src/toml/mutation.rs` 按 `(path, range, kind, key_range)` 重新解析目标，只规划最小 splice：改值、改键/表名、向表/inline 表加键、加子表/表数组、加 AoT entry、删除值/表/entry/AoT。删除不使用 `Table::span()` 或 `ArrayOfTables::span()` 当连续区间，而是逐条删除 header 行、直接 key/value 行与显式后代行，保留交错无关表。写入前重新解析结果并核对目标结构。"
replaced = "上游没有 TOML 树或 mutation；不导入 `serde_json`／Glim `format_document` 的整篇重排，不把 TOML 转成 JSON，不整篇 `DocumentMut::to_string()` 回写，也不把显示行号当身份"
