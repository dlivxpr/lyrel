adaptation = "由 CsvDocument 统一做一套解析与取消；列窗口分页保留（显示预算），记录集合不再分页而由完整逻辑表 + uniform_list 虚拟化承载；每个 CsvView 保存自己的选择/列窗口/筛选/排序/滚动；late parse/query 以 Document 身份、revision、generation 三重校验后才安装"
