scope = "csv::ReaderBuilder has_headers(false)/flexible(true) 的逻辑记录读取、quoted delimiter 与 multiline 语义、完整列集合、解析取消"
adaptation = "输入改为共享 Document snapshot 的同一 Arc<String>；预算改为具名 CsvLimits 并拒绝而非返回局部页；用 csv::ByteRecord::position 与 reader position 补记录区间、用字段边界扫描器补原始字段区间，并逐字段与 csv 解码值核对；不再为页面持有 decoder 的 ResourcePool；字段值不常驻，显示/排序/筛选/复制按区间从源文解码"
rejected = "Glim ResourcePool/WorkingReservation、IO_BUFFER_BYTES 与 TextRowsBuilder 容器、GeoJSON/GPX/KML 分支、任意 anyhow 错误透传均未导入"

