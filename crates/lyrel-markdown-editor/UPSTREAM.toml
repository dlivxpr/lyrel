# 本地适配：GPUI Kit/Fast 类型与命名空间；共享 Document/source/history/revision；
# 独立 presentation/IME/layout；有序 range-edit 通知；LF 坐标与逐行原始表示；
# 移除加载时公式规范化；保留超长 nowrap 行有界视觉布局；未配置 Host 控件不伪装可用。
# prepaint 复用当前行索引；viewport band 变化时按需补帧，避免远跳后的可见正文保持空白。
# #240：foreign selection rebase 发出可观察事件；已退役 IME lease 拒绝迟到失焦 callback，
# unmark 仅结束自己的 lease，仍有效的失焦提交不被拒绝。
# document.rs、presentation.rs 为 Lyrel 原创适配；文件 codec 属于独立 Apache-2.0 lyrel-text。
# 公式结构源导入 src/math；Lyrel 原创 markdown_formula Host 负责 seat、版本、range commit、菜单与返焦。
# GUI 仅 GPUI Kit/Fast；GUI-free RaTeX 0.1.15 使用正式 registry，未导入 GPL 应用层或独立 Markdown renderer。
# 本地公式适配：严格 AST 保真检查、未修改树不序列化、原始定界符/body-only 提交、Escape 取消；
# EntityInputHandler 预编辑/candidate geometry、Kit Button、本地化命令与原生菜单；NBSP 保持图片/公式 wrap atom。
# writing.rs 为 Lyrel 原创 Host request seam；紧凑 disclosure 与原生格式控件仍沿用 MIT editor。
# 内容 inset 在 scroll owner 内，公式/嵌入 overlay 共享 inset 后的坐标根；prose/list/quote spacing 随字体缩放。
# 自定义颜色原子替换同一源码范围；主题 provider 派生当前 semantic style，不重置模式或 history。
# #239：表格插入与样式原子history、cell Unicode/IME几何、列宽metadata随增删迁移；
# code语言仅替换token并保留fence metadata，高亮provider读取当前App主题。
# src/code.rs与应用markdown/table_code.rs为Lyrel原创Host适配，不导入GPL picker。
# 未导入 Zorite GPL 应用层、notebook 数据库或独立只读 Markdown renderer。

